# SPDX-License-Identifier: Apache-2.0
name: Trivy
description: >
  Comprehensive security scanning with Trivy: SBOM generation,
  vulnerability scanning, and license compliance
author: sentenz
branding:
  icon: shield
  color: purple

inputs:
  scan-type:
    description: "Type of scan to perform (fs, image, config, repository, rootfs, sbom, sbom-generate)"
    required: false
    default: "fs"
  scan-target:
    description: "Target to scan (path for fs/config/rootfs, image name for image, repo URL for repository)"
    required: false
    default: "."
  image:
    description: "Trivy Docker image with version tag and digest"
    required: false
    default: "aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969"
  format:
    description: "Output format (table, json, sarif, cyclonedx, spdx, spdx-json, github, cosign-vuln)"
    required: false
    default: ""
  output:
    description: "Output file path"
    required: false
    default: ""
  severity:
    description: "Severities to report (comma-separated: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
    required: false
    default: ""
  scanners:
    description: "Scanners to use (comma-separated: vuln,misconfig,secret,license)"
    required: false
    default: ""
  skip-dirs:
    description: "Directories to skip (comma-separated)"
    required: false
    default: ""
  skip-files:
    description: "Files to skip (comma-separated)"
    required: false
    default: ""
  exit-code:
    description: "Exit code when vulnerabilities are found"
    required: false
    default: ""
  cache-dir:
    description: "Cache directory"
    required: false
    default: ""
  db-repository:
    description: "Custom database repository"
    required: false
    default: ""
  trivyignore-file:
    description: "Path to .trivyignore file"
    required: false
    default: ""
  trivy-config:
    description: "Path to trivy.yaml config file"
    required: false
    default: ""
  github-pat:
    description: "GitHub Personal Access Token for private repositories"
    required: false
    default: ""

outputs:
  result:
    description: "Trivy scan result"
    value: ${{ steps.trivy.outputs.result }}
  exit-code:
    description: "Trivy exit code"
    value: ${{ steps.trivy.outputs.exit-code }}
  output-file:
    description: "Path to the output file (if specified)"
    value: ${{ steps.trivy.outputs.output-file }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_SCAN_TARGET: ${{ inputs.scan-target }}
        INPUT_SCAN_TYPE: ${{ inputs.scan-type }}
      run: |
        set -euo pipefail

        # Validate scan-type
        case "${INPUT_SCAN_TYPE}" in
          fs | image | config | repository | rootfs | sbom | sbom-generate) ;;
          *)
            printf '::error::Invalid scan-type %q. Must be one of: fs image config repository rootfs sbom sbom-generate\n' "${INPUT_SCAN_TYPE}"
            exit 1
            ;;
        esac

        # Validate scan-target exists for fs/config/rootfs scans
        if [[ "${INPUT_SCAN_TYPE}" =~ ^(fs|config|rootfs)$ ]] && [[ ! -e "${INPUT_SCAN_TARGET}" ]]; then
          printf '::error::Scan target %q does not exist\n' "${INPUT_SCAN_TARGET}"
          exit 1
        fi

        # Validate SBOM format for sbom-generate
        if [[ "${INPUT_SCAN_TYPE}" == "sbom-generate" ]]; then
          if [[ "${INPUT_FORMAT}" != "cyclonedx" && "${INPUT_FORMAT}" != "spdx" && "${INPUT_FORMAT}" != "spdx-json" ]]; then
            echo "::error::For sbom-generate, format must be cyclonedx, spdx, or spdx-json"
            exit 1
          fi
        fi

    - name: Trivy
      id: trivy
      shell: bash
      env:
        INPUT_CACHE_DIR: ${{ inputs.cache-dir }}
        INPUT_DB_REPOSITORY: ${{ inputs.db-repository }}
        INPUT_EXIT_CODE: ${{ inputs.exit-code }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_GITHUB_PAT: ${{ inputs.github-pat }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_SCAN_TARGET: ${{ inputs.scan-target }}
        INPUT_SCAN_TYPE: ${{ inputs.scan-type }}
        INPUT_SCANNERS: ${{ inputs.scanners }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_SKIP_DIRS: ${{ inputs.skip-dirs }}
        INPUT_SKIP_FILES: ${{ inputs.skip-files }}
        INPUT_TRIVY_CONFIG: ${{ inputs.trivy-config }}
        INPUT_TRIVYIGNORE_FILE: ${{ inputs.trivyignore-file }}
      run: |
        set -uo pipefail

        # Determine the actual scan command based on scan-type
        if [[ "${INPUT_SCAN_TYPE}" == "sbom-generate" ]]; then
          # For SBOM generation, detect if target is an image or filesystem
          # Image format: [registry.host:port/]namespace/image[:tag|@digest]
          if [[ "${INPUT_SCAN_TARGET}" =~ .*:.* ]] && [[ ! -e "${INPUT_SCAN_TARGET}" ]]; then
            trivy_command="image"
          else
            trivy_command="filesystem"
          fi
        elif [[ "${INPUT_SCAN_TYPE}" == "fs" ]]; then
          trivy_command="filesystem"
        else
          trivy_command="${INPUT_SCAN_TYPE}"
        fi

        # Build trivy command arguments
        trivy_args=("${trivy_command}")

        # Add config file if specified (Trivy will use this as base configuration)
        # Order of precedence: CLI flags > Environment variables > Config file > Defaults
        if [[ -n "${INPUT_TRIVY_CONFIG}" && -f "${INPUT_TRIVY_CONFIG}" ]]; then
          trivy_args+=(--config "${INPUT_TRIVY_CONFIG}")
        fi

        # Add format
        if [[ -n "${INPUT_FORMAT}" ]]; then
          trivy_args+=(--format "${INPUT_FORMAT}")
        fi

        # Add output file if specified
        if [[ -n "${INPUT_OUTPUT}" ]]; then
          output_dir="$(dirname "${INPUT_OUTPUT}")"
          mkdir -p "${output_dir}"
          trivy_args+=(--output "${INPUT_OUTPUT}")
        fi

        # Add severity filters (only for vuln scanning, not SBOM generation)
        if [[ "${INPUT_SCAN_TYPE}" != "sbom-generate" && -n "${INPUT_SEVERITY}" ]]; then
          trivy_args+=(--severity "${INPUT_SEVERITY}")
        fi

        # Add scanners (only for applicable scan types)
        if [[ -n "${INPUT_SCANNERS}" && "${INPUT_SCAN_TYPE}" != "sbom-generate" ]]; then
          trivy_args+=(--scanners "${INPUT_SCANNERS}")
        fi

        # Add skip directories
        if [[ -n "${INPUT_SKIP_DIRS}" ]]; then
          IFS=',' read -r -a skip_dirs <<< "${INPUT_SKIP_DIRS}"
          for dir in "${skip_dirs[@]}"; do
            trivy_args+=(--skip-dirs "${dir}")
          done
        fi

        # Add skip files
        if [[ -n "${INPUT_SKIP_FILES}" ]]; then
          IFS=',' read -r -a skip_files <<< "${INPUT_SKIP_FILES}"
          for file in "${skip_files[@]}"; do
            trivy_args+=(--skip-files "${file}")
          done
        fi

        # Add exit-code
        if [[ -n "${INPUT_EXIT_CODE}" ]]; then
          trivy_args+=(--exit-code "${INPUT_EXIT_CODE}")
        fi

        # Add cache directory
        if [[ -n "${INPUT_CACHE_DIR}" ]]; then
          mkdir -p "${INPUT_CACHE_DIR}"
          trivy_args+=(--cache-dir "${INPUT_CACHE_DIR}")
        fi

        # Add custom DB repository
        if [[ -n "${INPUT_DB_REPOSITORY}" ]]; then
          trivy_args+=(--db-repository "${INPUT_DB_REPOSITORY}")
        fi

        # Add .trivyignore file
        if [[ -n "${INPUT_TRIVYIGNORE_FILE}" && -f "${INPUT_TRIVYIGNORE_FILE}" ]]; then
          trivy_args+=(--ignorefile "${INPUT_TRIVYIGNORE_FILE}")
        fi

        # Add scan target
        trivy_args+=("${INPUT_SCAN_TARGET}")

        # Prepare Docker run command with appropriate volume mounts
        docker_args=(run --rm -v "${PWD}:/workspace" -w /workspace)

        # Mount docker socket for image scanning
        if [[ "${INPUT_SCAN_TYPE}" == "image" ]] || \
           [[ "${INPUT_SCAN_TYPE}" == "sbom-generate" && "${trivy_command}" == "image" ]]; then
          docker_args+=(-v /var/run/docker.sock:/var/run/docker.sock)
        fi

        # Add GitHub token if provided (for private repositories)
        if [[ -n "${INPUT_GITHUB_PAT}" ]]; then
          export GITHUB_TOKEN="${INPUT_GITHUB_PAT}"
          docker_args+=(--env GITHUB_TOKEN)
        fi

        # Run trivy via Docker
        command=(docker "${docker_args[@]}" "${INPUT_IMAGE}" "${trivy_args[@]}")
        printf 'Running:'
        printf ' %q' "${command[@]}"
        printf '\n'

        result="$("${command[@]}" 2>&1)"
        exit_code=$?

        delimiter="$(cat /proc/sys/kernel/random/uuid)"
        while grep -Fqx "${delimiter}" <<< "${result}" || grep -Fqx "${delimiter}" <<< "${INPUT_OUTPUT}"; do
          delimiter="$(cat /proc/sys/kernel/random/uuid)"
        done
        {
          printf 'result<<%s\n' "${delimiter}"
          printf '%s\n' "${result}"
          printf '%s\n' "${delimiter}"
          printf 'exit-code=%s\n' "${exit_code}"
          if [[ -n "${INPUT_OUTPUT}" ]]; then
            printf 'output-file<<%s\n' "${delimiter}"
            printf '%s\n' "${INPUT_OUTPUT}"
            printf '%s\n' "${delimiter}"
          fi
        } >> "${GITHUB_OUTPUT}"

        printf '%s\n' "${result}"

        exit "${exit_code}"
