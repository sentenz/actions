# SPDX-License-Identifier: Apache-2.0
name: Zensical
description: Test and build documentation with Zensical and upload a GitHub Pages artifact
author: sentenz

branding:
  icon: book-open
  color: blue

inputs:
  image-version:
    description: Official zensical/zensical image tag, optionally followed by a digest
    default: 0.1.0@sha256:a9512943ddf49c645fd3c0861e5347f9c889abe7f5fdaad05e047582b8069b70
  requirements-file:
    description: Pip requirements for the documentation project (empty uses the image as supplied)
    default: requirements-docs.txt
  tests-directory:
    description: Python unittest discovery directory (empty skips tests)
    default: tests/docs
  build-script:
    description: Python script invoked with the build argument (empty uses the Zensical CLI)
    default: scripts/docs.py
  site-directory:
    description: Generated Pages site directory, relative to the checkout
    default: public
  artifact-name:
    description: Pages artifact name
    default: github-pages

runs:
  using: composite
  steps:
    - name: Test and build in the Zensical container
      shell: bash
      env:
        IMAGE_VERSION: ${{ inputs.image-version }}
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        TESTS_DIRECTORY: ${{ inputs.tests-directory }}
        BUILD_SCRIPT: ${{ inputs.build-script }}
      run: |
        docker run --rm --interactive \
          --user "$(id -u):$(id -g)" \
          --volume "${GITHUB_WORKSPACE}:/docs" --workdir /docs \
          --env HOME=/tmp --env REQUIREMENTS_FILE --env TESTS_DIRECTORY --env BUILD_SCRIPT \
          --entrypoint /bin/sh "docker.io/zensical/zensical:${IMAGE_VERSION}" \
          -eu < "${GITHUB_ACTION_PATH}/build.sh"

    - name: Check Pages entry point
      shell: bash
      env:
        SITE_DIRECTORY: ${{ inputs.site-directory }}
      run: |
        if [[ -z "${SITE_DIRECTORY}" || ! -s "${SITE_DIRECTORY}/index.html" ]]; then
          echo "::error::Expected a generated index.html in the configured site-directory"
          exit 1
        fi

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.site-directory }}
