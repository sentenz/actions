# SPDX-License-Identifier: Apache-2.0

name: Trivy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - created

permissions: {}

jobs:
  trivy-fs-scan:
    name: Trivy Action - Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Filesystem Scan
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          exit-code: "1"
          scan-type: fs
          scan-target: "."
          format: sarif
          output: trivy-results.sarif

      - name: Upload results to GitHub Security
        if: ${{ !cancelled() && github.ref_type != 'tag' && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

  trivy-config-scan:
    name: Trivy Action - Configuration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Trivy Config Scan
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          exit-code: "1"
          scan-type: config
          scan-target: "."
          format: sarif
          output: trivy-iac.sarif
          severity: HIGH,CRITICAL

      - name: Upload Trivy Config Scan
        if: ${{ !cancelled() && github.ref_type != 'tag' && hashFiles('trivy-iac.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-config

  trivy-license-compliance:
    name: Trivy Action - License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run License Compliance Scan
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          exit-code: "1"
          scan-type: fs
          scan-target: "."
          scanners: license
          format: table
          severity: UNKNOWN,HIGH,CRITICAL

  trivy-sbom:
    name: Trivy Action - SBOM Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Scan generated SBOM
        uses: sentenz/actions/trivy@23361c53dc10a0980b449d78bb4481e4997da7d3 # 1.7.1
        with:
          scan-type: sbom
          scan-target: sbom.cdx.json
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Retain scanned SBOM
        if: ${{ !cancelled() && hashFiles('sbom.cdx.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
