# SPDX-License-Identifier: Apache-2.0

name: VS Code Extension

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish extension
        id: extension
        uses: sentenz/actions/vscode-extension@latest
        with:
          marketplace-token: ${{ secrets.VSCE_PAT }}
          output-path: artifacts/extension.vsix

      - name: Release summary
        env:
          EXTENSION_ID: ${{ steps.extension.outputs.extension-id }}
          EXTENSION_VERSION: ${{ steps.extension.outputs.version }}
          VSIX_PATH: ${{ steps.extension.outputs.vsix-path }}
        run: |
          {
            echo "## VS Code Extension Published"
            echo
            echo "- Extension: ${EXTENSION_ID}"
            echo "- Version: ${EXTENSION_VERSION}"
            echo "- VSIX: ${VSIX_PATH}"
          } >> "${GITHUB_STEP_SUMMARY}"
