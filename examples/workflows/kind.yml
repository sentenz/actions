# Set KUSTOMIZE_PATH to the directory containing kustomization.yaml.
name: Kind Deployment

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create local cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ci
          wait: 2m

      - name: Apply manifests and check rollouts
        env:
          KUSTOMIZE_PATH: ${{ vars.KUSTOMIZE_PATH || 'deploy' }}
        run: |
          set -euo pipefail
          kubectl --context kind-ci apply -k "${KUSTOMIZE_PATH}" -o json |
            jq -r '(.items // [.])[] | select(.kind == "Deployment" or .kind == "StatefulSet" or .kind == "DaemonSet")
              | [.metadata.namespace, (.kind + "/" + .metadata.name)] | @tsv' |
            while IFS=$'\t' read -r namespace workload; do
              kubectl --context kind-ci rollout status --namespace "${namespace}" "${workload}" --timeout=5m
            done

      - name: Show cluster events on failure
        if: failure()
        run: kubectl --context kind-ci get events --all-namespaces --sort-by=.metadata.creationTimestamp
