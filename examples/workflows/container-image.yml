# SPDX-License-Identifier: Apache-2.0

name: Container Image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      operation:
        description: Container image operation
        type: choice
        options:
          - build
          - publish
          - promote
        default: build
      version:
        description: Immutable image version for manual publish or promote operations
        type: string
        required: false
      publish_latest:
        description: Latest-tag policy
        type: choice
        options:
          - auto
          - "true"
          - "false"
        default: auto

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build or Publish Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Run container image operation
        id: image
        uses: sentenz/actions/container-image@latest
        with:
          operation: ${{ inputs.operation || 'auto' }}
          version: ${{ inputs.version }}
          publish-latest: ${{ inputs.publish_latest || 'auto' }}
          immutable: true
          platforms: linux/amd64,linux/arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report image
        env:
          OPERATION: ${{ steps.image.outputs.operation }}
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
          TAGS: ${{ steps.image.outputs.tags }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Container image"
            echo
            echo "- Operation: \`${OPERATION}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo '```text'
            printf '%s\n' "${TAGS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
