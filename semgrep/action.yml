# SPDX-License-Identifier: Apache-2.0
name: "Semgrep"
description: "Static analysis security testing (SAST) using Semgrep"
author: "sentenz"

branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Path to scan"
    required: false
    default: "."
  image:
    description: "Semgrep Docker image with version tag and digest"
    required: false
    default: "docker.io/semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796"
  config:
    description: "Semgrep configuration (auto, p/default, path to config file)"
    required: false
    default: "auto"
  severity:
    description: "Minimum severity to report (INFO, WARNING, ERROR)"
    required: false
    default: ""
  exclude:
    description: "Patterns to exclude (comma-separated)"
    required: false
    default: ""
  include:
    description: "Patterns to include (comma-separated)"
    required: false
    default: ""
  max-target-bytes:
    description: "Maximum file size to scan in bytes"
    required: false
    default: ""
  timeout:
    description: "Timeout per file in seconds"
    required: false
    default: ""
  jobs:
    description: "Number of parallel jobs"
    required: false
    default: ""
  metrics:
    description: "Enable/disable metrics (on, off, auto)"
    required: false
    default: "off"
  no-secrets-validation:
    description: "Disable secrets validation"
    required: false
    default: "true"
  gitlab-sast-output:
    description: "Path to GitLab SAST output file"
    required: false
    default: ""
  sarif-output:
    description: "Path to SARIF output file"
    required: false
    default: ""
  json-output:
    description: "Path to JSON output file"
    required: false
    default: ""

outputs:
  result:
    description: "Semgrep scan result"
    value: ${{ steps.semgrep.outputs.result }}
  exit-code:
    description: "Semgrep exit code"
    value: ${{ steps.semgrep.outputs.exit-code }}
  findings-count:
    description: "Number of findings"
    value: ${{ steps.semgrep.outputs.findings-count }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        if [[ ! -e "${INPUT_PATH}" ]]; then
          printf '::warning::Path %q does not exist\n' "${INPUT_PATH}"
        fi

    - name: Semgrep
      id: semgrep
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_GITLAB_SAST_OUTPUT: ${{ inputs.gitlab-sast-output }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_JSON_OUTPUT: ${{ inputs.json-output }}
        INPUT_MAX_TARGET_BYTES: ${{ inputs.max-target-bytes }}
        INPUT_METRICS: ${{ inputs.metrics }}
        INPUT_NO_SECRETS_VALIDATION: ${{ inputs.no-secrets-validation }}
        INPUT_SARIF_OUTPUT: ${{ inputs.sarif-output }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail

        # Build semgrep command arguments
        semgrep_args=(scan -q)

        # Add configuration
        if [[ -n "${INPUT_CONFIG}" ]]; then
          # Handle multiple configs separated by comma
          IFS=',' read -r -a configs <<< "${INPUT_CONFIG}"
          for config in "${configs[@]}"; do
            semgrep_args+=(--config "${config}")
          done
        fi

        # Add metrics setting
        if [[ -n "${INPUT_METRICS}" ]]; then
          semgrep_args+=(--metrics "${INPUT_METRICS}")
        fi

        # Add secrets validation flag
        if [[ "${INPUT_NO_SECRETS_VALIDATION}" == "true" ]]; then
          semgrep_args+=(--no-secrets-validation)
        fi

        # Add severity filter
        if [[ -n "${INPUT_SEVERITY}" ]]; then
          semgrep_args+=(--severity "${INPUT_SEVERITY}")
        fi

        # Add exclude patterns
        if [[ -n "${INPUT_EXCLUDE}" ]]; then
          IFS=',' read -r -a excludes <<< "${INPUT_EXCLUDE}"
          for pattern in "${excludes[@]}"; do
            semgrep_args+=(--exclude "${pattern}")
          done
        fi

        # Add include patterns
        if [[ -n "${INPUT_INCLUDE}" ]]; then
          IFS=',' read -r -a includes <<< "${INPUT_INCLUDE}"
          for pattern in "${includes[@]}"; do
            semgrep_args+=(--include "${pattern}")
          done
        fi

        # Add max-target-bytes
        if [[ -n "${INPUT_MAX_TARGET_BYTES}" ]]; then
          semgrep_args+=(--max-target-bytes "${INPUT_MAX_TARGET_BYTES}")
        fi

        # Add timeout
        if [[ -n "${INPUT_TIMEOUT}" ]]; then
          semgrep_args+=(--timeout "${INPUT_TIMEOUT}")
        fi

        # Add jobs
        if [[ -n "${INPUT_JOBS}" ]]; then
          semgrep_args+=(--jobs "${INPUT_JOBS}")
        fi

        # Add output formats
        if [[ -n "${INPUT_GITLAB_SAST_OUTPUT}" ]]; then
          semgrep_args+=(--gitlab-sast --gitlab-sast-output "/src/${INPUT_GITLAB_SAST_OUTPUT}")
        fi

        if [[ -n "${INPUT_SARIF_OUTPUT}" ]]; then
          semgrep_args+=(--sarif --sarif-output "/src/${INPUT_SARIF_OUTPUT}")
        fi

        if [[ -n "${INPUT_JSON_OUTPUT}" ]]; then
          semgrep_args+=(--json --json-output "/src/${INPUT_JSON_OUTPUT}")
        fi

        # Add path (mounted as /src in container)
        semgrep_args+=(/src)

        # Run semgrep via Docker
        # Note: The semgrep command must be explicitly specified because the
        # semgrep Docker image has an empty ENTRYPOINT (unlike conftest which
        # has ENTRYPOINT set to [/conftest])
        command=(docker run --rm -v "${PWD}:/src" "${INPUT_IMAGE}" semgrep "${semgrep_args[@]}")
        printf 'Running:'
        printf ' %q' "${command[@]}"
        printf '\n'

        if result="$("${command[@]}" 2>&1)"; then
          exit_code=0
        else
          exit_code=$?
        fi

        # Count findings (approximate)
        findings_count="$(printf '%s\n' "${result}" | grep -c '^' || printf '0')"

        delimiter="gha-output-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        while grep -Fqx "${delimiter}" <<< "${result}"; do
          delimiter="gha-output-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        done
        {
          printf 'result<<%s\n' "${delimiter}"
          printf '%s\n' "${result}"
          printf '%s\n' "${delimiter}"
          printf 'exit-code=%s\n' "${exit_code}"
          printf 'findings-count=%s\n' "${findings_count}"
        } >> "${GITHUB_OUTPUT}"

        stop_marker="gha-stop-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        while grep -Fq "::${stop_marker}::" <<< "${result}"; do
          stop_marker="gha-stop-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        done
        echo "::stop-commands::${stop_marker}"
        printf '%s\n' "${result}"
        echo "::${stop_marker}::"

        exit "${exit_code}"
