# SPDX-License-Identifier: Apache-2.0
name: "Semantic-Release"
description: "Run semantic-release with validated inputs and Conventional Commits defaults"
author: "sentenz"

branding:
  icon: "tag"
  color: "orange"

inputs:
  github-token:
    description: "GitHub token used by semantic-release"
    required: false
    default: "${{ github.token }}"
  semantic-version:
    description: "semantic-release version or version range"
    required: false
    default: "25"
  branches:
    description: "Release branches; empty preserves the repository configuration"
    required: false
    default: ""
  dry-run:
    description: "Override semantic-release dryRun: true, false, or empty"
    required: false
    default: ""
  ci:
    description: "Override semantic-release CI mode: true, false, or empty"
    required: false
    default: ""
  unset-gha-env:
    description: "Unset GITHUB_ACTIONS before semantic-release runs"
    required: false
    default: "false"
  extends:
    description: "Shareable semantic-release configurations (multiline)"
    required: false
    default: ""
  extra-plugins:
    description: "Additional npm packages installed before semantic-release (multiline)"
    required: false
    default: |
      @semantic-release/changelog@^6
      @semantic-release/git@^10
      conventional-changelog-conventionalcommits@^10
  use-default-config:
    description: "Use the action's Conventional Commits configuration when the repository has no release configuration"
    required: false
    default: "true"
  working-directory:
    description: "Repository-relative directory in which semantic-release runs"
    required: false
    default: "."
  tag-format:
    description: "Override semantic-release tagFormat; empty preserves the repository configuration"
    required: false
    default: ""
  repository-url:
    description: "Override the Git repository URL"
    required: false
    default: ""

outputs:
  new-release-published:
    description: "Whether a new release was published"
    value: ${{ steps.semantic-release.outputs.new_release_published }}
  new-release-version:
    description: "The new release version"
    value: ${{ steps.semantic-release.outputs.new_release_version }}
  new-release-major-version:
    description: "The new release major version"
    value: ${{ steps.semantic-release.outputs.new_release_major_version }}
  new-release-minor-version:
    description: "The new release minor version"
    value: ${{ steps.semantic-release.outputs.new_release_minor_version }}
  new-release-patch-version:
    description: "The new release patch version"
    value: ${{ steps.semantic-release.outputs.new_release_patch_version }}
  new-release-channel:
    description: "The new release channel"
    value: ${{ steps.semantic-release.outputs.new_release_channel }}
  new-release-notes:
    description: "The new release notes"
    value: ${{ steps.semantic-release.outputs.new_release_notes }}
  new-release-git-head:
    description: "The git HEAD of the new release"
    value: ${{ steps.semantic-release.outputs.new_release_git_head }}
  new-release-git-tag:
    description: "The git tag of the new release"
    value: ${{ steps.semantic-release.outputs.new_release_git_tag }}
  last-release-version:
    description: "The last release version"
    value: ${{ steps.semantic-release.outputs.last_release_version }}
  last-release-git-head:
    description: "The git HEAD of the last release"
    value: ${{ steps.semantic-release.outputs.last_release_git_head }}
  last-release-git-tag:
    description: "The git tag associated with the previous release"
    value: ${{ steps.semantic-release.outputs.last_release_git_tag }}

runs:
  using: "composite"
  steps:
    - name: Validate Inputs
      id: validate
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_CI: ${{ inputs.ci }}
        INPUT_UNSET_GHA_ENV: ${{ inputs.unset-gha-env }}
        INPUT_USE_DEFAULT_CONFIG: ${{ inputs.use-default-config }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        if [[ -z "${INPUT_GITHUB_TOKEN}" ]]; then
          echo "::error::github-token is required"
          exit 1
        fi

        validate_optional_boolean() {
          local name="$1"
          local value="$2"

          case "${value}" in
            "" | "true" | "false") ;;
            *)
              echo "::error::${name} must be true, false, or empty"
              exit 1
              ;;
          esac
        }

        validate_optional_boolean "dry-run" "${INPUT_DRY_RUN}"
        validate_optional_boolean "ci" "${INPUT_CI}"
        validate_optional_boolean "unset-gha-env" "${INPUT_UNSET_GHA_ENV}"
        validate_optional_boolean "use-default-config" "${INPUT_USE_DEFAULT_CONFIG}"

        workspace="$(cd -- "${GITHUB_WORKSPACE}" && pwd -P)"
        if ! working_directory="$(cd -- "${GITHUB_WORKSPACE}/${INPUT_WORKING_DIRECTORY}" && pwd -P)"; then
          echo "::error::working-directory does not exist: ${INPUT_WORKING_DIRECTORY}"
          exit 1
        fi

        case "${working_directory}/" in
          "${workspace}/"*) ;;
          *)
            echo "::error::working-directory must resolve inside GITHUB_WORKSPACE"
            exit 1
            ;;
        esac

        echo "working-directory=${working_directory}" >> "${GITHUB_OUTPUT}"

    - name: Prepare Default Configuration
      id: configuration
      if: ${{ inputs.use-default-config == 'true' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ steps.validate.outputs.working-directory }}
      run: |
        set -euo pipefail

        config_found=false
        for candidate in \
          .releaserc \
          .releaserc.json \
          .releaserc.yaml \
          .releaserc.yml \
          .releaserc.js \
          .releaserc.cjs \
          release.config.js \
          release.config.cjs; do
          if [[ -f "${WORKING_DIRECTORY}/${candidate}" ]]; then
            config_found=true
            break
          fi
        done

        if [[ "${config_found}" == "false" && -f "${WORKING_DIRECTORY}/package.json" ]]; then
          if node -e '
            const fs = require("node:fs");
            const path = process.argv[1];
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            process.exit(Object.prototype.hasOwnProperty.call(pkg, "release") ? 0 : 1);
          ' "${WORKING_DIRECTORY}/package.json"; then
            config_found=true
          fi
        fi

        if [[ "${config_found}" == "false" ]]; then
          cp -- \
            "${ACTION_PATH}/config/.releaserc.json" \
            "${WORKING_DIRECTORY}/.releaserc.json"
          echo "created=true" >> "${GITHUB_OUTPUT}"
          echo "path=${WORKING_DIRECTORY}/.releaserc.json" >> "${GITHUB_OUTPUT}"
          echo "::notice::Using the action's Conventional Commits semantic-release configuration"
        else
          echo "created=false" >> "${GITHUB_OUTPUT}"
        fi

    - name: Semantic Release
      id: semantic-release
      uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      with:
        semantic_version: ${{ inputs.semantic-version }}
        branches: ${{ inputs.branches }}
        extra_plugins: ${{ inputs.extra-plugins }}
        dry_run: ${{ inputs.dry-run }}
        ci: ${{ inputs.ci }}
        unset_gha_env: ${{ inputs.unset-gha-env }}
        extends: ${{ inputs.extends }}
        working_directory: ${{ steps.validate.outputs.working-directory }}
        tag_format: ${{ inputs.tag-format }}
        repository_url: ${{ inputs.repository-url }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Remove Temporary Configuration
      if: ${{ always() && steps.configuration.outputs.created == 'true' }}
      shell: bash
      env:
        CONFIG_PATH: ${{ steps.configuration.outputs.path }}
      run: |
        set -euo pipefail
        rm -f -- "${CONFIG_PATH}"
