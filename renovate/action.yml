# SPDX-License-Identifier: Apache-2.0
name: "Renovate"
description: "Automated dependency updates using Renovate"
author: "sentenz"

branding:
  icon: "refresh-cw"
  color: "purple"

inputs:
  token:
    description: "GitHub token for Renovate"
    required: true
    default: "${{ github.token }}"
  version:
    description: "Renovate version"
    required: false
    default: "46.1.17"
  autodiscover:
    description: "Autodiscover repositories"
    required: false
    default: "true"
  config-file:
    description: "Path to renovate configuration file"
    required: false
    default: ""
  platform:
    description: "Platform to run on (github, gitlab, gitea, bitbucket)"
    required: false
    default: "github"

runs:
  using: "composite"
  steps:
    - name: Validate Inputs
      shell: bash
      run: |
        if [[ -z "${{ inputs.token }}" ]]; then
          echo "Error: GitHub token is required"
          exit 1
        fi

    - name: Renovate
      id: renovate
      uses: renovatebot/github-action@v46.1.19
      with:
        token: ${{ inputs.token }}
      env:
        LOG_LEVEL: "debug"
        RENOVATE_REPOSITORIES: ${{ github.repository }}
