# SPDX-License-Identifier: Apache-2.0
name: "Renovate"
description: "Automated dependency updates using Renovate"
author: "sentenz"

branding:
  icon: "refresh-cw"
  color: "purple"

inputs:
  token:
    description: "Platform access token for Renovate. GitHub GITHUB_TOKEN is not supported."
    required: true
  autodiscover:
    description: "Autodiscover repositories instead of limiting Renovate to the current repository."
    required: false
    default: "false"
  config-file:
    description: "Path to the self-hosted Renovate configuration file."
    required: false
    default: ""
  platform:
    description: "Renovate platform identifier."
    required: false
    default: "github"
  log-level:
    description: "Renovate log level. Options: trace, debug, info, warn, error, fatal"
    required: false
    default: "info"

runs:
  using: "composite"
  steps:
    - name: Validate Inputs
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_AUTODISCOVER: ${{ inputs.autodiscover }}
        WORKFLOW_GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [[ -z "${INPUT_TOKEN}" ]]; then
          echo "::error::A platform access token is required."
          exit 1
        fi

        if [[ "${INPUT_TOKEN}" == "${WORKFLOW_GITHUB_TOKEN}" ]]; then
          echo "::error::GITHUB_TOKEN cannot authenticate self-hosted Renovate. Provide a dedicated Personal Access Token or GitHub App installation token."
          exit 1
        fi

        case "${INPUT_AUTODISCOVER}" in
          true|false) ;;
          *)
            echo "::error::The autodiscover input must be either true or false."
            exit 1
            ;;
        esac

    - name: Configure Repository Selection
      shell: bash
      env:
        INPUT_AUTODISCOVER: ${{ inputs.autodiscover }}
      run: |
        if [[ "${INPUT_AUTODISCOVER}" == "true" ]]; then
          echo "RENOVATE_AUTODISCOVER=true" >> "${GITHUB_ENV}"
          echo "RENOVATE_REPOSITORIES=" >> "${GITHUB_ENV}"
        else
          echo "RENOVATE_AUTODISCOVER=false" >> "${GITHUB_ENV}"
          echo "RENOVATE_REPOSITORIES=${GITHUB_REPOSITORY}" >> "${GITHUB_ENV}"
        fi

    - name: Renovate
      id: renovate
      uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
      with:
        token: ${{ inputs.token }}
        configurationFile: ${{ inputs.config-file }}
      env:
        LOG_LEVEL: ${{ inputs.log-level }}
        RENOVATE_PLATFORM: ${{ inputs.platform }}
