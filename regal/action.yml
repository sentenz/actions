# SPDX-License-Identifier: Apache-2.0
name: "Regal"
description: "Linting for Rego policies using Regal"
author: "sentenz"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  path:
    description: "Path to the policy directory"
    required: false
    default: "./policy"
  regal-version:
    description: "Regal version"
    required: false
    default: "latest"
  output-format:
    description: "Output format (pretty, compact, json, github, sarif)"
    required: false
    default: "github"
  config-file:
    description: "Path to Regal configuration file"
    required: false
    default: ""
  disable-category:
    description: "Comma-separated list of categories to disable"
    required: false
    default: ""
  enable-category:
    description: "Comma-separated list of categories to enable"
    required: false
    default: ""

outputs:
  result:
    description: "Regal lint result"
    value: ${{ steps.regal.outputs.result }}
  exit-code:
    description: "Regal exit code"
    value: ${{ steps.regal.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Setup Regal
      uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
      with:
        version: ${{ inputs.regal-version }}

    - name: Validate inputs
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail

        if [[ ! -d "${INPUT_PATH}" ]]; then
          printf '::warning::Path %q does not exist or is not a directory\n' "${INPUT_PATH}"
        fi

    - name: Regal
      id: regal
      shell: bash
      env:
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_DISABLE_CATEGORY: ${{ inputs.disable-category }}
        INPUT_ENABLE_CATEGORY: ${{ inputs.enable-category }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -uo pipefail

        # Build regal command arguments
        regal_args=(lint)

        # Add output format
        regal_args+=(--format "${INPUT_OUTPUT_FORMAT}")

        # Add config file if specified
        if [[ -n "${INPUT_CONFIG_FILE}" && -f "${INPUT_CONFIG_FILE}" ]]; then
          regal_args+=(--config-file "${INPUT_CONFIG_FILE}")
        fi

        # Add disable categories
        if [[ -n "${INPUT_DISABLE_CATEGORY}" ]]; then
          IFS=',' read -r -a categories <<< "${INPUT_DISABLE_CATEGORY}"
          for category in "${categories[@]}"; do
            regal_args+=(--disable-category "${category}")
          done
        fi

        # Add enable categories
        if [[ -n "${INPUT_ENABLE_CATEGORY}" ]]; then
          IFS=',' read -r -a categories <<< "${INPUT_ENABLE_CATEGORY}"
          for category in "${categories[@]}"; do
            regal_args+=(--enable-category "${category}")
          done
        fi

        # Add path
        regal_args+=("${INPUT_PATH}")

        command=(regal "${regal_args[@]}")
        printf 'Running:'
        printf ' %q' "${command[@]}"
        printf '\n'

        result="$("${command[@]}" 2>&1)"
        exit_code=$?

        delimiter="$(cat /proc/sys/kernel/random/uuid)"
        while grep -Fqx "${delimiter}" <<< "${result}"; do
          delimiter="$(cat /proc/sys/kernel/random/uuid)"
        done
        {
          printf 'result<<%s\n' "${delimiter}"
          printf '%s\n' "${result}"
          printf '%s\n' "${delimiter}"
          printf 'exit-code=%s\n' "${exit_code}"
        } >> "${GITHUB_OUTPUT}"

        printf '%s\n' "${result}"

        exit "${exit_code}"
