# SPDX-License-Identifier: Apache-2.0

name: Renovate Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/renovate-test.yml"
      - "renovate/**"
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: renovate-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate Action
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate Test
        uses: ./renovate
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          autodiscover: "false"
          log-level: debug
        env:
          RENOVATE_CONFIG_VALIDATION_ERROR: "true"
