# SPDX-License-Identifier: Apache-2.0

name: Renovate Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 6"

jobs:
  renovate:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renovate Test
        uses: ./renovate
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
