# SPDX-License-Identifier: Apache-2.0

name: Renovate

on:
  workflow_call:
    secrets:
      renovate-token:
        required: true

jobs:
  all:
    name: Renovate Action
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Renovate
        uses: sentenz/actions/renovate@main
        with:
          token: ${{ secrets.renovate-token }}
