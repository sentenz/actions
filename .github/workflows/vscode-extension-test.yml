name: VS Code Extension Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension-test.yml"

jobs:
  vscode-extension:
    name: VS Code Extension Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Run Relative Version Test
        id: relative-version
        uses: ./vscode-extension
        with:
          working-directory: "vscode-extension/test"
          output-path: "dist/test-extension-patch.vsix"
          version: "patch"
          no-dependencies: "true"
          publish: "false"

      - name: Verify Relative Version Outputs
        env:
          EXTENSION_VERSION: ${{ steps.relative-version.outputs.version }}
          VSIX_PATH: ${{ steps.relative-version.outputs.vsix-path }}
        run: |
          test "${EXTENSION_VERSION}" = "0.0.2"
          test -f "${VSIX_PATH}"
          test "$(node -p 'require("./vscode-extension/test/package.json").version')" = "0.0.1"

      - name: Run Tagged Semantic Version Test
        id: tagged-version
        uses: ./vscode-extension
        with:
          working-directory: "vscode-extension/test"
          output-path: "dist/test-extension-v1.0.0.vsix"
          version: "v1.0.0"
          no-dependencies: "true"
          publish: "false"

      - name: Verify Tagged Semantic Version Outputs
        env:
          EXTENSION_VERSION: ${{ steps.tagged-version.outputs.version }}
          VSIX_PATH: ${{ steps.tagged-version.outputs.vsix-path }}
        run: |
          test "${EXTENSION_VERSION}" = "1.0.0"
          test -f "${VSIX_PATH}"
          test "$(node -p 'require("./vscode-extension/test/package.json").version')" = "0.0.1"
