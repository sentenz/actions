# SPDX-License-Identifier: Apache-2.0

name: Semantic-Release Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - next
      - beta
      - alpha

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Semantic-Release Action
    # workflow_dispatch must follow the same branch allowlist as push.
    if: contains(fromJSON('["refs/heads/main", "refs/heads/next", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Semantic Release Test
        uses: ./semantic-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: "false"
