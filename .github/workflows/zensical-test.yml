# SPDX-License-Identifier: Apache-2.0
name: Zensical Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - zensical/**
      - .github/workflows/zensical-test.yml
  pull_request:
    branches: [main]
    paths:
      - zensical/**
      - .github/workflows/zensical-test.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: skills
            ref: 2be7da702f17cd8879069ef7b6879ca20daa31ef
          - project: convention
            ref: 21dd1fb6b70ee05db80d41acaa8fe6afabf0b6c4
          - project: plain
    timeout-minutes: 10
    steps:
      - name: Checkout documentation project
        if: matrix.project != 'plain'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sentenz/${{ matrix.project }}
          ref: ${{ matrix.ref }}
          persist-credentials: false

      - name: Checkout action under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .actions
          persist-credentials: false

      - name: Build project with documentation dependencies and tests
        if: matrix.project != 'plain'
        uses: ./.actions/zensical
        with:
          artifact-name: pages-${{ matrix.project }}

      - name: Create a standalone Zensical project
        if: matrix.project == 'plain'
        run: |
          mkdir -p docs
          printf '[project]\nsite_name = "Example"\n' > zensical.toml
          printf '# Example\n' > docs/index.md

      - name: Build standalone project using only the image
        if: matrix.project == 'plain'
        uses: ./.actions/zensical
        with:
          image: docker.io/zensical/zensical@sha256:a9512943ddf49c645fd3c0861e5347f9c889abe7f5fdaad05e047582b8069b70
          requirements-file: ''
          tests-directory: ''
          build-script: ''
          site-directory: site
