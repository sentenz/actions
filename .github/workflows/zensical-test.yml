# SPDX-License-Identifier: Apache-2.0
name: Zensical Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - zensical/**
      - .github/workflows/zensical-test.yml
  pull_request:
    branches: [main]
    paths:
      - zensical/**
      - .github/workflows/zensical-test.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [plain, gfm]
    timeout-minutes: 10
    steps:
      - name: Checkout action under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .actions
          persist-credentials: false

      - name: Create a standalone Zensical project
        if: matrix.project == 'plain'
        run: |
          mkdir -p docs
          printf '[project]\nsite_name = "Example"\n' > zensical.toml
          printf '# Example\n' > docs/index.md

      - name: Prepare GFM documentation
        if: matrix.project == 'gfm'
        run: cp -R .actions/zensical/test/gfm/{docs,zensical.toml} .

      - name: Build documentation and upload Pages artifact
        uses: ./.actions/zensical
        with:
          site-directory: site
          flavor: ${{ matrix.project == 'gfm' && 'gfm' || '' }}
          artifact-name: pages-${{ matrix.project }}

      - name: Install GFM verifier dependency
        if: matrix.project == 'gfm'
        run: python -m pip install --disable-pip-version-check html5lib==1.1

      - name: Verify GitHub Flavored Markdown output
        if: matrix.project == 'gfm'
        run: python .actions/zensical/test/gfm/verify.py
