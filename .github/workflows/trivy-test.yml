name: Trivy Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trivy-test.yml
      - trivy/**
      - lib/**
      - trivy.yaml
      - .trivyignore
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trivy-test.yml
      - trivy/**
      - lib/**
      - trivy.yaml
      - .trivyignore

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-fs-scan:
    name: Trivy Action - Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy Filesystem Scan
        uses: ./trivy
        with:
          scan-type: fs
          scan-target: "."
          format: sarif
          exit-code: "0"

  trivy-config-scan:
    name: Trivy Action - Configuration Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy Config Scan
        uses: ./trivy
        with:
          scan-type: config
          scan-target: "."
          format: sarif
          exit-code: "0"

  trivy-sbom-generation:
    name: Trivy Action - SBOM Generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: ./trivy
        with:
          scan-type: sbom-generate
          sbom-target: filesystem
          cache-dir: .cache/trivy
          skip-dirs: .cache/trivy
          exit-code: "0"
          scan-target: "."
          format: "cyclonedx"
          output: "sbom.cdx.json"

      - name: Generate SPDX SBOM
        uses: ./trivy
        with:
          scan-type: sbom-generate
          sbom-target: filesystem
          cache-dir: .cache/trivy
          skip-dirs: .cache/trivy
          exit-code: "0"
          scan-target: "."
          format: "spdx-json"
          output: "sbom.spdx.json"

      - name: Validate SBOM formats
        run: |
          jq -e '.bomFormat == "CycloneDX"' sbom.cdx.json
          jq -e '.spdxVersion | startswith("SPDX-")' sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: sbom-files
          path: |
            sbom.cdx.json
            sbom.spdx.json

  trivy-license-compliance:
    name: Trivy Action - License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: License Compliance Scan
        uses: ./trivy
        with:
          scan-type: fs
          scan-target: "."
          scanners: "license"
          format: "table"
          exit-code: "0"
