# SPDX-License-Identifier: Apache-2.0

name: Semgrep Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep Test
        uses: ./semgrep
        with:
          path: "."
          config: "p/default"
          metrics: "off"
          no-secrets-validation: "true"
          sarif-output: semgrep-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep-results.sarif

      - name: Prepare fixtures outside Semgrep's default test exclusions
        run: cp -R tests/fixtures/semgrep semgrep-fixtures

      - name: Scan a selected fixture at WARNING and above
        id: fixture
        uses: ./semgrep
        with:
          path: semgrep-fixtures/selected
          config: tests/fixtures/semgrep/rules.yml
          severity: WARNING
          json-output: reports/fixture.json
          sarif-output: reports/fixture.sarif

      - name: Assert findings and report contracts
        env:
          FINDINGS: ${{ steps.fixture.outputs.findings-count }}
        run: |
          test "${FINDINGS}" = "2"
          jq -e '.results | length == 2' reports/fixture.json
          jq -e 'all(.results[]; .path | contains("/selected/"))' reports/fixture.json
          jq -e '.runs | length > 0' reports/fixture.sarif
