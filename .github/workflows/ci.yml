# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate action.yml files
        run: |
          echo "Validating action.yml files..."
          for action_file in $(find . -name "action.yml" -type f); do
            echo "Checking: ${action_file}"
            if ! yq eval '.' "${action_file}" > /dev/null 2>&1; then
              echo "::error::Invalid YAML in ${action_file}"
              exit 1
            fi
            # Check required fields
            if ! yq eval '.name' "${action_file}" > /dev/null 2>&1; then
              echo "::error::Missing 'name' field in ${action_file}"
              exit 1
            fi
            if ! yq eval '.description' "${action_file}" > /dev/null 2>&1; then
              echo "::error::Missing 'description' field in ${action_file}"
              exit 1
            fi
            if ! yq eval '.runs' "${action_file}" > /dev/null 2>&1; then
              echo "::error::Missing 'runs' field in ${action_file}"
              exit 1
            fi
          done
          echo "All action.yml files are valid!"

  lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install yamllint
        run: pip install yamllint

      - name: Yamllint
        run: yamllint -c .yamllint.yml .
        continue-on-error: true

  container-image:
    name: Test Container Image Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build with repository image name
        id: repository-name
        uses: ./container-image
        with:
          version: 0.0.0-ci
          context: container-image/test
          file: container-image/test/Dockerfile
          push: false

      - name: Validate repository image metadata
        env:
          IMAGE: ${{ steps.repository-name.outputs.image }}
          TAGS: ${{ steps.repository-name.outputs.tags }}
        run: |
          set -euo pipefail
          expected_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "${IMAGE}" == "${expected_image}" ]]
          grep -Fx "${expected_image}:latest" <<< "${TAGS}"
          grep -Fx "${expected_image}:0.0.0-ci" <<< "${TAGS}"

      - name: Build with custom image name
        id: custom-name
        uses: ./container-image
        with:
          version: v1.2.3-ci
          image-name: CI-Image
          context: container-image/test
          file: container-image/test/Dockerfile
          push: false

      - name: Validate custom image metadata
        env:
          IMAGE: ${{ steps.custom-name.outputs.image }}
          TAGS: ${{ steps.custom-name.outputs.tags }}
        run: |
          set -euo pipefail
          expected_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-image"
          [[ "${IMAGE}" == "${expected_image}" ]]
          grep -Fx "${expected_image}:latest" <<< "${TAGS}"
          grep -Fx "${expected_image}:v1.2.3-ci" <<< "${TAGS}"

      - name: Reject empty version
        id: empty-version
        continue-on-error: true
        uses: ./container-image
        with:
          version: ""
          context: container-image/test
          file: container-image/test/Dockerfile
          push: false

      - name: Verify empty version rejection
        env:
          OUTCOME: ${{ steps.empty-version.outcome }}
        run: test "${OUTCOME}" = failure

      - name: Reject malformed image name
        id: malformed-name
        continue-on-error: true
        uses: ./container-image
        with:
          version: 1.0.0
          image-name: ghcr.io/example/api:latest
          context: container-image/test
          file: container-image/test/Dockerfile
          push: false

      - name: Verify malformed image name rejection
        env:
          OUTCOME: ${{ steps.malformed-name.outcome }}
        run: test "${OUTCOME}" = failure
