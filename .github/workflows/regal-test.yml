# SPDX-License-Identifier: Apache-2.0

name: Regal Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.rego"
      - "regal/**"
      - "lib/**"
      - ".github/workflows/regal-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rego"
      - "regal/**"
      - "lib/**"
      - ".github/workflows/regal-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regal:
    name: Regal Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Regal Test
        uses: ./regal
        with:
          path: "./tests/policy"
          output-format: "github"
          regal-version: "latest"
