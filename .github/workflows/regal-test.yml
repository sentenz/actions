# SPDX-License-Identifier: Apache-2.0

name: Regal Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.rego"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.rego"

jobs:
  regal:
    name: Regal Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Regal Test
        uses: ./regal
        with:
          path: "./tests/policy"
          output-format: "github"
          regal-version: "latest"
