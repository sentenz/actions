name: Sigstore Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sigstore/**"
      - ".github/workflows/sigstore-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "sigstore/**"
      - ".github/workflows/sigstore-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  validate:
    name: Validate Sigstore signing contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test validation and verification failure propagation
        run: python3 sigstore/test/test_action.py
