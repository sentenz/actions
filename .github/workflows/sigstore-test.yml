name: Sigstore Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sigstore/**"
      - "trivy/**"
      - "trivy.yaml"
      - ".github/workflows/sigstore-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "sigstore/**"
      - "trivy/**"
      - "trivy.yaml"
      - ".github/workflows/sigstore-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  sbom:
    name: Generate, sign, and verify SBOMs
    # Fork pull requests do not receive the OIDC permission needed for signing.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate CycloneDX SBOM
        uses: ./trivy
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: cyclonedx
          output: sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: ./trivy
        with:
          scan-type: sbom-generate
          scan-target: "."
          format: spdx-json
          output: sbom.spdx.json

      - name: Sign and verify SBOMs
        uses: ./sigstore
        with:
          identity: https://github.com/${{ github.workflow_ref }}
          files: |
            sbom.cdx.json
            sbom.spdx.json

      - name: Retain SBOMs and verification bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-sboms-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sbom.cdx.json
            sbom.cdx.json.sigstore.json
            sbom.spdx.json
            sbom.spdx.json.sigstore.json
          if-no-files-found: error
          retention-days: 90
