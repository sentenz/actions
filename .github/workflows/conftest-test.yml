# SPDX-License-Identifier: Apache-2.0

name: Conftest Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "policy/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/policy/**"

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Conftest Test
        uses: ./conftest
        with:
          path: "."
          policy-path: "./tests/policy"
          output-format: "github"
          fail-on-warn: "false"
          all-namespaces: "true"
