# SPDX-License-Identifier: Apache-2.0

name: Conftest Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "policy/**"
  pull_request:
    branches: [main]
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "**/policy/**"

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Conftest Test
        uses: ./conftest
        with:
          path: "."
          policy-path: "./tests/policy"
          output-format: "github"
          fail-on-warn: "false"
          all-namespaces: "true"

      - name: Reject shell injection in action inputs
        id: injection
        continue-on-error: true
        uses: ./conftest
        with:
          path: '$(touch /tmp/conftest-input-injection)'

      - name: Verify shell input remained data
        env:
          OUTCOME: ${{ steps.injection.outcome }}
        run: |
          set -euo pipefail
          test "${OUTCOME}" = failure
          test ! -e /tmp/conftest-input-injection
