name: Conftest Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/conftest-test.yml
      - conftest/**
      - lib/**
      - tests/policy/**
      - tests/fixtures/conftest/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/conftest-test.yml
      - conftest/**
      - lib/**
      - tests/policy/**
      - tests/fixtures/conftest/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Conftest Test
        uses: ./conftest
        with:
          path: "conftest/action.yml"
          policy-path: "./tests/policy"
          output-format: "github"
          fail-on-warn: "false"
          all-namespaces: "true"

      - name: Accept a known passing policy fixture
        uses: ./conftest
        with:
          path: tests/fixtures/conftest/pass.json
          policy-path: tests/fixtures/conftest/policy

      - name: Reject a known failing policy fixture
        id: rejected
        continue-on-error: true
        uses: ./conftest
        with:
          path: tests/fixtures/conftest/fail.json
          policy-path: tests/fixtures/conftest/policy

      - name: Assert policy rejection
        env:
          OUTCOME: ${{ steps.rejected.outcome }}
          EXIT_CODE: ${{ steps.rejected.outputs.exit-code }}
        run: |
          test "${OUTCOME}" = failure
          test "${EXIT_CODE}" = 1
