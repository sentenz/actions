# SPDX-License-Identifier: Apache-2.0

name: Conftest Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/conftest-test.yml
      - conftest/**
      - tests/policy/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/conftest-test.yml
      - conftest/**
      - tests/policy/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conftest:
    name: Conftest Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Conftest Test
        uses: ./conftest
        with:
          path: "conftest/action.yml"
          policy-path: "./tests/policy"
          output-format: "github"
          fail-on-warn: "false"
          all-namespaces: "true"
