# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - &github-actions-base
    package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: 03:00
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
    allow:
      - dependency-type: direct

    # Group updates by semantic version type
    groups:
      github-actions-patch:
        update-types:
          - patch
      github-actions-minor:
        update-types:
          - minor
      github-actions-major:
        update-types:
          - major

  - <<: *github-actions-base
    directory: /conftest

  - <<: *github-actions-base
    directory: /regal

  - <<: *github-actions-base
    directory: /renovate

  - <<: *github-actions-base
    directory: /semantic-release

  - <<: *github-actions-base
    directory: /semgrep

  - <<: *github-actions-base
    directory: /trivy
