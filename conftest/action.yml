# SPDX-License-Identifier: Apache-2.0
name: "Conftest"
description: "Policy-as-Code (PaC) testing using Open Policy Agent Conftest"
author: "sentenz"

branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to the files/directories to test"
    required: false
    default: "."
  policy-path:
    description: "Path to the policy directory"
    required: false
    default: "policy"
  image:
    description: "Conftest Docker image with version tag and digest"
    required: false
    default: "openpolicyagent/conftest:v0.69.0@sha256:a38ba21668929a00dce2fe6ee43d1312228340bce5fd243f47dd0ce90516e558"
  output-format:
    description: "Output format (stdout, json, tap, table, junit, github)"
    required: false
    default: "github"
  fail-on-warn:
    description: "Fail on warnings"
    required: false
    default: "false"
  all-namespaces:
    description: "Use all namespaces"
    required: false
    default: "true"
  config-file:
    description: "Path to conftest configuration file"
    required: false
    default: ""
  data-files:
    description: "Path to data files (space-separated)"
    required: false
    default: ""

outputs:
  result:
    description: "Conftest validation result"
    value: ${{ steps.conftest.outputs.result }}
  exit-code:
    description: "Conftest exit code"
    value: ${{ steps.conftest.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_POLICY_PATH: ${{ inputs.policy-path }}
      run: |
        set -euo pipefail

        if [[ ! -e "${INPUT_PATH}" ]]; then
          printf '::error::Path %q does not exist\n' "${INPUT_PATH}"
          exit 1
        fi
        if [[ ! -d "${INPUT_POLICY_PATH}" && -z "${INPUT_CONFIG_FILE}" ]]; then
          printf '::warning::Policy path %q does not exist. Using default configuration.\n' "${INPUT_POLICY_PATH}"
        fi

    - name: Conftest
      id: conftest
      shell: bash
      env:
        INPUT_ALL_NAMESPACES: ${{ inputs.all-namespaces }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_DATA_FILES: ${{ inputs.data-files }}
        INPUT_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_OUTPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_POLICY_PATH: ${{ inputs.policy-path }}
      run: |
        set -euo pipefail

        # Build conftest command arguments
        conftest_args=(test)

        # Add policy path if it exists
        if [[ -d "${INPUT_POLICY_PATH}" ]]; then
          conftest_args+=(--policy "${INPUT_POLICY_PATH}")
        fi

        # Add output format
        conftest_args+=(--output "${INPUT_OUTPUT_FORMAT}")

        # Add fail-on-warn flag
        if [[ "${INPUT_FAIL_ON_WARN}" == "true" ]]; then
          conftest_args+=(--fail-on-warn)
        fi

        # Add all-namespaces flag
        if [[ "${INPUT_ALL_NAMESPACES}" == "true" ]]; then
          conftest_args+=(--all-namespaces)
        fi

        # Add config file if specified
        if [[ -n "${INPUT_CONFIG_FILE}" && -f "${INPUT_CONFIG_FILE}" ]]; then
          conftest_args+=(--config-file "${INPUT_CONFIG_FILE}")
        fi

        # Add data files if specified
        if [[ -n "${INPUT_DATA_FILES}" ]]; then
          read -r -a data_files <<< "${INPUT_DATA_FILES}"
          for data_file in "${data_files[@]}"; do
            if [[ -f "${data_file}" ]]; then
              conftest_args+=(--data "${data_file}")
            fi
          done
        fi

        # Add path to test
        conftest_args+=("${INPUT_PATH}")

        command=(docker run --rm -v "${PWD}:/workspace" -w /workspace "${INPUT_IMAGE}" "${conftest_args[@]}")
        printf 'Running:'
        printf ' %q' "${command[@]}"
        printf '\n'

        # Run conftest via Docker
        if result="$("${command[@]}" 2>&1)"; then
          exit_code=0
        else
          exit_code=$?
        fi

        delimiter="gha-output-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        while grep -Fqx "${delimiter}" <<< "${result}"; do
          delimiter="gha-output-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        done
        {
          printf 'result<<%s\n' "${delimiter}"
          printf '%s\n' "${result}"
          printf '%s\n' "${delimiter}"
          printf 'exit-code=%s\n' "${exit_code}"
        } >> "${GITHUB_OUTPUT}"

        stop_marker="gha-stop-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        while grep -Fq "::${stop_marker}::" <<< "${result}"; do
          stop_marker="gha-stop-${RANDOM}-${RANDOM}-${RANDOM}-${RANDOM}"
        done
        echo "::stop-commands::${stop_marker}"
        printf '%s\n' "${result}"
        echo "::${stop_marker}::"

        exit "${exit_code}"
